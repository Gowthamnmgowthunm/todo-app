<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - To-Do App</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {
            width: 510px;
            background: white;
            padding: 50px 38px 40px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            font-size: 40px;
            margin: 0 0 25px;
        }

        h2 {
            text-align: center;
            font-size: 30px;
            margin: 0 0 35px;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            height: 53px;
            padding: 0 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #777;
        }

        .password-input {
            padding-right: 55px;
        }

        .eye-button {
            position: absolute;
            right: 8px;
            top: 0;
            width: 45px;
            height: 53px;
            border: none;
            background: transparent;
            color: #333;
            font-size: 20px;
            cursor: pointer;
        }

        .eye-button:hover {
            background: transparent;
        }

        .message {
            text-align: center;
            color: red;
            font-size: 14px;
            margin: 0 0 15px;
        }

        .register-button {
            width: 100%;
            height: 51px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .register-button:hover {
            background: #222;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
        }

        .login-link a {
            color: #551a8b;
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h1>To-Do App</h1>

    <h2>Create Account</h2>

    <form id="registerForm">

        <div class="input-box">
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter Name"
                required
            >
        </div>

        <div class="input-box">
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter Email"
                required
            >
        </div>

        <div class="input-box">

            <input
                type="password"
                id="password"
                name="password"
                class="password-input"
                placeholder="Create Password"
                required
            >

            <button
                type="button"
                class="eye-button"
                onclick="togglePassword()"
            >
                👁️
            </button>

        </div>

        <div class="input-box">

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                class="password-input"
                placeholder="Confirm Password"
                required
            >

            <button
                type="button"
                class="eye-button"
                onclick="toggleConfirmPassword()"
            >
                👁️
            </button>

        </div>

        <p id="message" class="message"></p>

        <button
            type="submit"
            class="register-button"
        >
            Register
        </button>

    </form>

    <div class="login-link">
        <a href="login.html">
            Already have an account? Login
        </a>
    </div>

</div>

<script src="script.js"></script>

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelectorAll(".eye-button")[0];

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "🙈";
    } else {
        password.type = "password";
        button.textContent = "👁️";
    }
}


function toggleConfirmPassword() {

    const password =
        document.getElementById("confirmPassword");

    const button =
        document.querySelectorAll(".eye-button")[1];

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "🙈";
    } else {
        password.type = "password";
        button.textContent = "👁️";
    }
}

</script>

</body>
</html>
