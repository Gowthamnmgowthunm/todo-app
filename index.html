<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="app">
      <h1>My To-Do App</h1>
      <p class="subtitle">Organize your day, one task at a time.</p>

      <div class="input-row">
        <input id="taskInput" type="text" placeholder="Enter a task..." maxlength="100">
        <button id="addBtn">Add</button>
      </div>

      <div class="stats">
        <span id="taskCount">0 tasks</span>
        <button id="clearBtn" class="clear">Clear completed</button>
      </div>

      <ul id="taskList"></ul>
      <p id="emptyMessage" class="empty">No tasks yet. Add your first task!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
