\<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <div class="header">
        <div>
            <h1>My To-Do App</h1>
            <p>Stay organized and get things done.</p>
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </div>


    <!-- Add Task -->
    <form id="todoForm">

        <div class="top-row">

            <input
                type="text"
                id="todoInput"
                placeholder="What needs to be done?"
                required
            >

            <select id="priority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>

        </div>


        <div class="date-row">

            <input
                type="date"
                id="taskDate"
            >

            <input
                type="time"
                id="taskTime"
            >

        </div>


        <button type="submit" class="add-btn">
            Add Task
        </button>

    </form>


    <!-- Task information -->
    <div class="task-header">

        <span id="taskCount">
            0 tasks remaining
        </span>

        <button
            class="clear-btn"
            onclick="clearCompleted()"
        >
            Clear completed
        </button>

    </div>


    <!-- Tasks -->
    <div id="todoList"></div>

</div>

<script src="script.js"></script>

</body>
</html>
