<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - To-Do App</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 500px;
            background: white;

            padding: 50px 40px;

            border-radius: 14px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            font-size: 40px;
            margin: 0 0 25px;
            color: #000;
        }

        h2 {
            text-align: center;
            font-size: 30px;
            margin: 0 0 35px;
            color: #000;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            height: 53px;

            padding: 0 16px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #777;
        }

        .password-input {
            padding-right: 55px;
        }

        .eye-button {
            position: absolute;

            right: 8px;
            top: 0;

            width: 45px;
            height: 53px;

            border: none;
            background: transparent;

            color: #333;

            font-size: 20px;

            cursor: pointer;
        }

        .eye-button:hover {
            background: transparent;
        }

        #errorMessage {
            text-align: center;
            color: red;

            font-size: 14px;

            margin: 0 0 15px;
        }

        .login-button {
            width: 100%;
            height: 51px;

            background: #333;

            color: white;

            border: none;
            border-radius: 5px;

            font-size: 16px;

            cursor: pointer;
        }

        .login-button:hover {
            background: #222;
        }

        .register-link {
            text-align: center;

            margin-top: 20px;

            font-size: 20px;
        }

        .register-link a {
            color: #551a8b;

            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>To-Do App</h1>

    <h2>Login</h2>

    <form id="loginForm">

        <div class="input-box">

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter Email"
                required
            >

        </div>


        <div class="input-box">

            <input
                type="password"
                id="password"
                name="password"
                class="password-input"
                placeholder="Enter Password"
                required
            >

            <button
                type="button"
                class="eye-button"
                onclick="toggleLoginPassword()"
            >
                👁️
            </button>

        </div>


        <p id="errorMessage"></p>


        <button
            type="submit"
            class="login-button"
        >
            Login
        </button>

    </form>


    <div class="register-link">

        <a href="register.html">
            Create Account
        </a>

    </div>

</div>


<script src="script.js"></script>

<script>

function toggleLoginPassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".eye-button");


    if (password.type === "password") {

        password.type = "text";

        button.textContent = "🙈";

    } else {

        password.type = "password";

        button.textContent = "👁️";

    }
}

</script>

</body>
</html>
